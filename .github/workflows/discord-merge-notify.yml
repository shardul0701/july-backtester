name: Discord Merge Notification

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Post merge notice to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set. Run: gh secret set DISCORD_WEBHOOK_URL --repo $REPO_NAME"
            exit 1
          fi

          payload=$(jq -n \
            --arg content "" \
            --arg title "✅ PR merged into \`main\` — $REPO_NAME" \
            --arg desc "**#$PR_NUMBER: $PR_TITLE**
by $PR_AUTHOR" \
            --arg url "$PR_URL" \
            '{
              content: $content,
              embeds: [{
                title: $title,
                description: $desc,
                url: $url,
                color: 5763719
              }]
            }')

          curl -sf -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
